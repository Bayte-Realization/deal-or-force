[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; game/map_data is read by filesystem path, never by res://: MapRasterCatalog, TerrainCatalog
; and the world-map loader all resolve it through GameDataLoader (LocalPath / FindDataFile),
; and an exported res:// is a .pck that System.IO cannot see. So the csproj Content items copy
; it in as real files and the export must not pack it a second time. Everything under game/gfx
; stays: those are loaded with GD.Load through res:// and genuinely need the archive.
exclude_filter="addons/*, .kilo/*, .fennara/*, art/*, demo/*, tmp/*, Tools/*, docs/*, mods/*, @icons picker.html, game/map_data/*"
export_path="build/windows/Deal or Force.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.8.1.0"
application/product_version="0.8.1.0"
application/company_name="Bayte Realization"
application/product_name="Deal or Force"
application/file_description="By Deal or Force"
application/copyright="Copyright (C) 2026 Bayte Realization. GNU GPL v3 or later."
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
